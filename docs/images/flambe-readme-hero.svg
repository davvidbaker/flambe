<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Flambé nested work timeline</title>
  <desc id="desc">A stylized flame chart showing human and coding-agent activities nested on a shared timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7043"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="598" rx="27" fill="none" stroke="#2b3548" stroke-width="2"/>

  <circle cx="42" cy="38" r="7" fill="#ff5f57"/>
  <circle cx="67" cy="38" r="7" fill="#febc2e"/>
  <circle cx="92" cy="38" r="7" fill="#28c840"/>
  <text x="600" y="44" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">where did the day go?</text>

  <line x1="122" y1="93" x2="1145" y2="93" stroke="#293449" stroke-width="1"/>
  <line x1="122" y1="168" x2="1145" y2="168" stroke="#293449" stroke-width="1"/>
  <line x1="122" y1="243" x2="1145" y2="243" stroke="#293449" stroke-width="1"/>
  <line x1="122" y1="318" x2="1145" y2="318" stroke="#293449" stroke-width="1"/>
  <line x1="122" y1="393" x2="1145" y2="393" stroke="#293449" stroke-width="1"/>
  <line x1="122" y1="468" x2="1145" y2="468" stroke="#293449" stroke-width="1"/>

  <text x="46" y="130" fill="#f8fafc" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">YOU</text>
  <text x="31" y="280" fill="#93c5fd" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AGENT</text>
  <text x="46" y="430" fill="#f8fafc" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">YOU</text>

  <rect x="145" y="106" width="915" height="48" rx="12" fill="url(#ember)" filter="url(#glow)" opacity="0.98"/>
  <text x="166" y="137" fill="#1f2937" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Ship the feature</text>

  <rect x="230" y="181" width="610" height="48" rx="12" fill="#ff8a52"/>
  <text x="251" y="212" fill="#28170f" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Why is auth broken?</text>

  <rect x="335" y="256" width="395" height="48" rx="12" fill="url(#agent)" filter="url(#glow)"/>
  <text x="356" y="287" fill="#0b1020" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Trace failing test</text>

  <rect x="452" y="331" width="215" height="48" rx="12" fill="#64748b"/>
  <text x="473" y="362" fill="#f8fafc" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">read docs 🤦</text>

  <rect x="745" y="406" width="250" height="48" rx="12" fill="#ff9f67"/>
  <text x="766" y="437" fill="#28170f" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">back to actual work</text>

  <rect x="1008" y="406" width="52" height="48" rx="12" fill="#f97316"/>
  <text x="1034" y="437" text-anchor="middle" fill="#fff7ed" font-size="22" font-family="Arial, sans-serif">✓</text>

  <path d="M145 512 C 320 487, 450 545, 620 518 S 910 490, 1060 520" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="145" y="557" fill="#94a3b8" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Nested work in. Flat guilt list out.</text>
  <text x="1060" y="557" text-anchor="end" fill="#64748b" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">human + agent, one flame</text>
</svg>
