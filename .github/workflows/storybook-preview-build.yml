name: Build Storybook preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/storybook-preview-build.yml'
      - '.github/workflows/storybook-preview-publish.yml'
  push:
    branches: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/storybook-preview-build.yml'
      - '.github/workflows/storybook-preview-publish.yml'

permissions:
  contents: read

concurrency:
  group: storybook-preview-build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook
      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          path: frontend/storybook-static
          if-no-files-found: error
          retention-days: 7
