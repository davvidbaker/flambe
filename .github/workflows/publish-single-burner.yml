name: Publish Flambé Single Burner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'single-burner/package.json'
      - '.github/workflows/publish-single-burner.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: single-burner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Read package version
        id: package
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: published
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the CLI dependency to be published
        if: steps.published.outputs.exists != 'true'
        run: |
          cli_version=$(node -p "require('./package.json').dependencies['@davvidbaker/flambe-cli']")
          for attempt in {1..30}; do
            if npm view "@davvidbaker/flambe-cli@$cli_version" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for CLI $cli_version to reach npm ($attempt/30)."
            sleep 10
          done
          echo "::error::CLI $cli_version is not published; check the CLI publish workflow."
          exit 1

      - if: steps.published.outputs.exists != 'true'
        run: npm install
      - if: steps.published.outputs.exists != 'true'
        run: npm pack --dry-run
      - name: Publish to npm with trusted publishing
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public
