name: Publish Flambé Single Burner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'single-burner/package.json'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: single-burner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install
      - run: npm pack --dry-run
      - name: Publish to npm with trusted publishing
        run: npm publish --access public
