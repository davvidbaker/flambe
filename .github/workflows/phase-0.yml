name: Modernization validation

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
      - name: Install Phoenix 1.8 dependencies
        working-directory: backend
        run: mix deps.get
      - name: Run Phoenix 1.8 checks
        working-directory: backend
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate
          MIX_ENV=test mix precommit

  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test agent CLI
        working-directory: cli
        run: npm test
      - name: Verify CLI package contents
        working-directory: cli
        run: npm pack --dry-run

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
      - name: Install Phoenix 1.8 dependencies and seed CI data
        working-directory: backend
        run: |
          mix deps.get
          mix ecto.create
          mix ecto.migrate
          mix flambe_next.seed_e2e
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Run strict TypeScript checks
        working-directory: frontend
        run: npm run typecheck
      - name: Build Storybook for the app chart
        working-directory: frontend
        run: npm run build-storybook
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build Vite frontend for Phoenix 1.8
        working-directory: frontend
        run: npm run build
      - name: Start Phoenix 1.8 with the built frontend
        working-directory: backend
        run: mix phx.server > /tmp/flambe-next-phoenix.log 2>&1 &
      - name: Smoke test bearer-authenticated agent CLI against Phoenix
        run: |
          until curl --fail --silent http://localhost:4001/login; do sleep 1; done
          TOKEN=$(cd backend && mix flambe_next.create_api_token e2e@flambe.local "CI agent" --raw | tail -n 1)
          TRACE_ID=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost:4001/api/traces | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(String(JSON.parse(d).data[0].id)))")
          ACTIVITY_ID=$(FLAMBE_URL=http://localhost:4001 FLAMBE_API_TOKEN="$TOKEN" FLAMBE_TRACE_ID="$TRACE_ID" node cli/bin/flambe.mjs start "CLI smoke activity")
          FLAMBE_URL=http://localhost:4001 FLAMBE_API_TOKEN="$TOKEN" FLAMBE_TRACE_ID="$TRACE_ID" node cli/bin/flambe.mjs end "$ACTIVITY_ID" "CLI smoke complete"
      - name: Run Phoenix 1.8-served browser smoke test
        working-directory: frontend
        run: |
          PLAYWRIGHT_BASE_URL=http://localhost:4001 npm run test:smoke
      - name: Upload Phoenix 1.8 server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-1-8-server-logs
          path: |
            /tmp/flambe-next-phoenix.log

  prod-mode-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: prod
      DATABASE_URL: ecto://postgres:postgres@localhost/flambe_next_prod_ci
      SECRET_KEY_BASE: CI-prod-secret-key-base-that-is-at-least-sixty-four-bytes-long!!
      FLAMBE_INVITE_CODE: test-invite
      PHX_HOST: localhost
      PHX_URL_SCHEME: http
      PHX_URL_PORT: '4001'
      PORT: '4001'
      ECTO_SSL: 'false'
      PLAYWRIGHT_INVITE_CODE: test-invite
      FLAMBE_ALLOW_E2E_SEED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
      - name: Install Phoenix 1.8 dependencies and prepare prod database
        working-directory: backend
        run: |
          mix deps.get
          mix ecto.create
          mix ecto.migrate
          mix flambe_next.seed_e2e
      - name: Mint a CI agent token before the server binds the port
        working-directory: backend
        run: |
          TOKEN=$(mix flambe_next.create_api_token e2e@flambe.local "CI agent" --raw | tail -n 1)
          echo "FLAMBE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build Vite frontend for Phoenix 1.8
        working-directory: frontend
        run: npm run build
      - name: Start Phoenix 1.8 in MIX_ENV=prod
        working-directory: backend
        env:
          PHX_SERVER: 'true'
        run: mix phx.server > /tmp/flambe-next-phoenix-prod.log 2>&1 &
      - name: Wait for prod health and smoke the agent CLI
        run: |
          until curl --fail --silent --output /dev/null http://localhost:4001/api/health; do sleep 1; done
          TRACE_ID=$(curl --fail --silent -H "Authorization: Bearer $FLAMBE_API_TOKEN" http://localhost:4001/api/traces | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(String(JSON.parse(d).data[0].id)))")
          ACTIVITY_ID=$(FLAMBE_URL=http://localhost:4001 FLAMBE_TRACE_ID="$TRACE_ID" node cli/bin/flambe.mjs start "CLI prod smoke")
          FLAMBE_URL=http://localhost:4001 FLAMBE_TRACE_ID="$TRACE_ID" node cli/bin/flambe.mjs end "$ACTIVITY_ID" "CLI prod smoke complete"
      - name: Run browser smoke against MIX_ENV=prod
        working-directory: frontend
        run: PLAYWRIGHT_BASE_URL=http://localhost:4001 npm run test:smoke
      - name: Upload MIX_ENV=prod server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-prod-server-logs
          path: |
            /tmp/flambe-next-phoenix-prod.log

  deploy-fly:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: [backend, cli, browser-smoke, prod-mode-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: fly-deploy-flambe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
