name: Modernization validation

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
      - name: Install Phoenix 1.8 dependencies
        working-directory: backend_next
        run: mix deps.get
      - name: Run Phoenix 1.8 checks
        working-directory: backend_next
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate
          MIX_ENV=test mix precommit

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
      - name: Install Phoenix 1.8 dependencies and seed CI data
        working-directory: backend_next
        run: |
          mix deps.get
          mix ecto.create
          mix ecto.migrate
          mix flambe_next.seed_e2e
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build Vite frontend for Phoenix 1.8
        working-directory: frontend
        run: VITE_PHOENIX_TARGET=next npm run build
      - name: Start Phoenix 1.8 with the built frontend
        working-directory: backend_next
        run: mix phx.server > /tmp/flambe-next-phoenix.log 2>&1 &
      - name: Run Phoenix 1.8-served browser smoke test
        working-directory: frontend
        run: |
          until curl --fail --silent http://localhost:4001/login; do sleep 1; done
          PLAYWRIGHT_BASE_URL=http://localhost:4001 npm run test:smoke
      - name: Upload Phoenix 1.8 server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-1-8-server-logs
          path: |
            /tmp/flambe-next-phoenix.log
